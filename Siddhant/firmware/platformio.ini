; SafarSaathi bus device: ESP32 + NEO-6M GPS + 2x IR break-beam + SIM800L GSM.
; Build/flash: pio run -t upload ; serial log: pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
  mikalhart/TinyGPSPlus @ ^1.0.3
  vshymanskyy/TinyGSM @ ^0.12.0
  knolleary/PubSubClient @ ^2.8
