# Mosquitto config for a real pilot (the Python dev broker in tools/broker.py allows anyone).
# Each bus device and the backend get their own username/password; the ACL limits topics.
#   mosquitto_passwd -c passwords backend
#   mosquitto_passwd passwords B-14        (repeat per bus)
# Over the internet (SIM800L), terminate TLS on 8883; SIM800L TLS support is limited, so many deployments
# put the broker behind a VPN/APN or accept plain MQTT only on a private APN. Decide this with Rahul.

listener 8883
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key

allow_anonymous false
password_file /etc/mosquitto/passwords
acl_file /etc/mosquitto/acl
persistence true
